<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>No internet</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #fdf8f2; color: #2b1d14; text-align: center; padding: 24px; }
  .card { max-width: 340px; }
  h1 { font-size: 22px; margin: 16px 0 8px; color: #9a1c1f; }
  p { margin: 0 0 20px; line-height: 1.5; color: #6b5b4e; }
  button { font: inherit; font-weight: 700; color: #fff; background: #9a1c1f; border: 0; border-radius: 12px; padding: 12px 22px; }
  @media (prefers-color-scheme: dark) { body { background: #1c1512; color: #f4ece4; } p { color: #c9b8a8; } }
</style></head>
<body><div class="card">
  <div style="font-size:44px">📶</div>
  <h1>No internet connection</h1>
  <p>Bills and orders are saved online, so this needs the internet. Check Wi-Fi or mobile data, then try again.</p>
  <button onclick="location.reload()">Try again</button>
</div></body></html>
